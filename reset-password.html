<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Lights On Me</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!--
  PAGE REBOND : reinitialisation de mot de passe (2026-07-25)
  ===========================================================
  Jumelle stricte de confirm.html, meme structure et memes regles de
  securite ; seules la destination (APP_URL) et la copie changent.
  Supabase redirige ici apres verification du token :
      https://lightsonme.app/reset-password?code=XXXX
  puis cette page relaie vers coachme://reset-password?code=XXXX, ou
  app/reset-password.tsx consomme le code (PKCE) et affiche le
  formulaire de nouveau mot de passe.

  Toute modification de securite faite ici doit etre repercutee dans
  confirm.html, et inversement.

  Commentaires sans accent volontairement : ce bloc n'est jamais affiche,
  seul l'objet COPY ci-dessous porte le texte vu par l'utilisateur.
-->
<style>
  :root { --bg:#F7F1E5; --surface:#FCF6EB; --border:#E8E4DC; --text:#1A1A1A; --muted:#666666; --brand:#C4956A; --brand-text:#7A5F3B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; line-height:1.7; }
  header { border-bottom:1px solid var(--border); padding:18px 24px; }
  header a { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:20px; font-weight:600; color:var(--text); text-decoration:none; }
  header a span { display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--brand); margin-right:9px; }
  main { max-width:560px; margin:0 auto; padding:64px 24px; text-align:center; }
  h1 { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:clamp(26px,5vw,34px); line-height:1.25; margin-bottom:14px; }
  p.lead { font-size:16px; margin-bottom:28px; }
  a.btn { display:inline-block; background:var(--brand); color:#FFFFFF; text-decoration:none; font-size:16px; font-weight:500; padding:15px 30px; border-radius:50px; }
  p.note { font-size:13px; color:var(--muted); margin-top:32px; line-height:1.6; }
  footer { border-top:1px solid var(--border); padding:24px; text-align:center; font-size:13px; color:var(--muted); }
  footer a { color:var(--brand-text); text-decoration:none; }
  footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
<header><a href="/"><span></span>Lights On Me</a></header>
<main>
  <h1 id="lom-h"></h1>
  <p class="lead" id="lom-l"></p>
  <p id="lom-c"><a class="btn" id="lom-b" href="#"></a></p>
  <p class="note" id="lom-n"></p>
  <noscript>
    <p class="lead">Active JavaScript, puis rouvre ce lien depuis ton téléphone.</p>
    <p class="note">Enable JavaScript, then open this link again from your phone.</p>
  </noscript>
</main>
<footer>
  <a href="/">lightsonme.app</a><br>
  © 2026 Lights On Me · Genève
</footer>
<script>
(function () {
  "use strict";

  // Destination FIXE. Jamais lue depuis l'URL : pas de redirection ouverte.
  var APP_URL = "coachme://reset-password";

  var COPY = {
    fr: {
      title: "Nouveau mot de passe",
      heading: "Ouverture de l'application",
      lead: "Nous ouvrons Lights On Me pour que tu choisisses un nouveau mot de passe. Si rien ne se passe, touche le bouton ci-dessous.",
      button: "Ouvrir Lights On Me",
      note: "Cette page fonctionne uniquement sur le téléphone où Lights On Me est installée. Si tu as ouvert cet email sur un ordinateur, rouvre-le depuis ton téléphone.",
      errHeading: "Lien expiré",
      errLead: "Ce lien a expiré ou a déjà été utilisé. Ouvre Lights On Me sur ton téléphone et redemande un email de réinitialisation."
    },
    en: {
      title: "New password",
      heading: "Opening the app",
      lead: "We are opening Lights On Me so you can choose a new password. If nothing happens, tap the button below.",
      button: "Open Lights On Me",
      note: "This page only works on the phone where Lights On Me is installed. If you opened this email on a computer, open it again from your phone.",
      errHeading: "Link expired",
      errLead: "This link has expired or has already been used. Open Lights On Me on your phone and request a new reset email."
    },
    es: {
      title: "Nueva contraseña",
      heading: "Abriendo la aplicación",
      lead: "Estamos abriendo Lights On Me para que elijas una nueva contraseña. Si no ocurre nada, toca el botón de abajo.",
      button: "Abrir Lights On Me",
      note: "Esta página solo funciona en el teléfono donde está instalada Lights On Me. Si abriste este correo en un ordenador, ábrelo de nuevo desde tu teléfono.",
      errHeading: "Enlace caducado",
      errLead: "Este enlace ha caducado o ya se ha utilizado. Abre Lights On Me en tu teléfono y solicita un nuevo correo de restablecimiento."
    },
    de: {
      title: "Neues Passwort",
      heading: "App wird geöffnet",
      lead: "Wir öffnen Lights On Me, damit du ein neues Passwort wählen kannst. Wenn nichts passiert, tippe auf den Button unten.",
      button: "Lights On Me öffnen",
      note: "Diese Seite funktioniert nur auf dem Telefon, auf dem Lights On Me installiert ist. Wenn du diese E-Mail auf einem Computer geöffnet hast, öffne sie erneut auf deinem Telefon.",
      errHeading: "Link abgelaufen",
      errLead: "Dieser Link ist abgelaufen oder wurde bereits verwendet. Öffne Lights On Me auf deinem Telefon und fordere eine neue E-Mail zum Zurücksetzen an."
    },
    it: {
      title: "Nuova password",
      heading: "Apertura dell'app",
      lead: "Stiamo aprendo Lights On Me per farti scegliere una nuova password. Se non succede nulla, tocca il pulsante qui sotto.",
      button: "Apri Lights On Me",
      note: "Questa pagina funziona solo sul telefono dove è installata Lights On Me. Se hai aperto questa e-mail su un computer, riaprila dal tuo telefono.",
      errHeading: "Link scaduto",
      errLead: "Questo link è scaduto o è già stato utilizzato. Apri Lights On Me sul tuo telefono e richiedi una nuova e-mail di reimpostazione."
    },
    pt: {
      title: "Nova palavra-passe",
      heading: "A abrir a aplicação",
      lead: "Estamos a abrir a Lights On Me para escolheres uma nova palavra-passe. Se nada acontecer, toca no botão abaixo.",
      button: "Abrir a Lights On Me",
      note: "Esta página só funciona no telemóvel onde a Lights On Me está instalada. Se abriste este e-mail num computador, abre-o novamente a partir do teu telemóvel.",
      errHeading: "Link expirado",
      errLead: "Este link expirou ou já foi utilizado. Abre a Lights On Me no teu telemóvel e pede um novo e-mail de redefinição."
    }
  };

  var raw = String(navigator.language || navigator.userLanguage || "fr").slice(0, 2).toLowerCase();
  var lang = COPY[raw] ? raw : "fr";
  var c = COPY[lang];
  document.documentElement.lang = lang;
  document.title = c.title;

  var q = new URLSearchParams(location.search);
  // Supabase peut signaler un echec dans la query OU dans le fragment.
  var hash = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  var code = q.get("code") || "";
  var failed = q.get("error") || q.get("error_code") || hash.get("error") || hash.get("error_code");

  // Allow-list stricte avant toute concatenation dans une URL.
  var VALID = /^[A-Za-z0-9._~-]{8,512}$/;
  var ok = !failed && VALID.test(code);

  // Le code a usage unique ne reste ni dans la barre d'adresse ni dans
  // l'historique (donc hors synchro du navigateur).
  try { history.replaceState({}, "", location.pathname); } catch (e) { /* noop */ }

  var elH = document.getElementById("lom-h");
  var elL = document.getElementById("lom-l");
  var elC = document.getElementById("lom-c");
  var elB = document.getElementById("lom-b");
  var elN = document.getElementById("lom-n");

  if (!ok) {
    elH.textContent = c.errHeading;
    elL.textContent = c.errLead;
    elC.style.display = "none";
    return;
  }

  var deepLink = APP_URL + "?code=" + encodeURIComponent(code);
  elH.textContent = c.heading;
  elL.textContent = c.lead;
  elB.textContent = c.button;
  elB.setAttribute("href", deepLink);
  elN.textContent = c.note;

  // Ouverture automatique. Le bouton reste le filet quand le navigateur
  // refuse une navigation automatique vers un scheme custom.
  setTimeout(function () {
    try { location.replace(deepLink); } catch (e) { /* le bouton prend le relais */ }
  }, 80);
})();
</script>
</body>
</html>
